# Android build (phase A0 of ryuon/android/ROADMAP.md): unit tests against the fixtures shared
# with the desktop code, a shrunk release APK, and checks that it stays light and offline.
name: Android

on:
  push:
    branches: [android, main]
    paths: ['android/**', 'tests/fixtures/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tests/fixtures/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared fixtures)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Light and offline
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt
          size=$(stat -c %s "$apk")
          echo "APK: $apk, $((size / 1024)) KB"
          "$aapt" dump permissions "$apk" | tee permissions.txt
          if [ "$size" -gt $((10 * 1024 * 1024)) ]; then echo "APK is over 10 MB"; exit 1; fi
          if grep -qE "INTERNET|ACCESS_NETWORK_STATE|AD_ID" permissions.txt; then echo "Network or ad permission found"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ryuon-android
          path: android/app/build/outputs/apk/release/*.apk
