# Windows build (phase W0 of windows/ROADMAP.md): compiles Ryuon with the MSYS2 UCRT64
# toolchain, runs the unit tests, and keeps the installed tree as a build artifact.
name: Windows

on:
  push:
    branches: [windows, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_HOME: ${{ github.workspace }}\.cargo-home
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p rust:p meson:p ninja:p pkgconf:p blueprint-compiler:p
            gettext-tools:p glib2:p gtk4:p libadwaita:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p gst-plugins-bad:p

      - name: Cache Rust crates and build
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            _build/src/release
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Versions
        run: |
          rustc --version
          pkg-config --modversion gtk4 libadwaita-1 gstreamer-1.0

      - name: Configure
        run: meson setup _build --prefix="$PWD/dist/Ryuon" -Dprofile=default

      - name: Build
        run: ninja -C _build

      - name: Unit tests
        run: cargo test --release --manifest-path Cargo.toml --target-dir _build/src

      - name: Install
        run: ninja -C _build install

      - name: Starts
        run: ./dist/Ryuon/bin/ryuon.exe --help

      - name: Bundle (portable folder with every DLL and plugin)
        run: windows/bundle.sh dist/Ryuon bundle/Ryuon

      # Launch from a clean PATH, as on a PC without MSYS2: it must find everything itself
      - name: Opens from the bundle
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\system32;C:\Windows"
          $env:RUST_LOG = "ryuon=debug"
          $p = Start-Process -FilePath bundle\Ryuon\bin\ryuon.exe -PassThru `
                 -RedirectStandardError ryuon-stderr.txt -RedirectStandardOutput ryuon-stdout.txt
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\windows-screenshot.png")
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-Content ryuon-stderr.txt -Tail 40
          if (-not $alive) { throw "ryuon.exe exited early with code $($p.ExitCode)" }

      # Each format decodes with the bundled plugins only (no audio device needed)
      - name: Decodes MP3, FLAC, Ogg, Opus, M4A with the bundled plugins
        run: |
          cp "$MINGW_PREFIX/bin/gst-launch-1.0.exe" bundle/Ryuon/bin/
          export PATH="$PWD/bundle/Ryuon/bin:/usr/bin" GST_PLUGIN_SYSTEM_PATH="$PWD/bundle/Ryuon/lib/gstreamer-1.0"
          export GST_REGISTRY="$PWD/gst-registry.bin"
          fail=0
          for f in windows/test-media/tone.*; do
            uri="file:///$(cygpath -m "$PWD/$f")"
            if gst-launch-1.0.exe -q uridecodebin uri="$uri" ! audioconvert ! audioresample ! fakesink sync=false; then
              echo "decodes: $f"
            else
              echo "FAILS: $f"; fail=1
            fi
            # The player's own path: playbin3 with Ryuon's ReplayGain filter, silent output
            if gst-launch-1.0.exe -q playbin3 uri="$uri" audio-sink="fakesink sync=false" video-sink=fakesink \
                 audio-filter="rgvolume ! rglimiter"; then
              echo "plays (playbin3): $f"
            else
              echo "FAILS (playbin3): $f"; fail=1
            fi
          done
          rm bundle/Ryuon/bin/gst-launch-1.0.exe
          exit $fail

      - name: Plays the test files in Ryuon
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\system32;C:\Windows"
          $env:RUST_LOG = "ryuon=debug"
          $env:GST_DEBUG = "2"
          $files = Get-ChildItem windows\test-media\tone.* | ForEach-Object { $_.FullName }
          $p = Start-Process -FilePath bundle\Ryuon\bin\ryuon.exe -ArgumentList $files -PassThru `
                 -RedirectStandardError play-stderr.txt -RedirectStandardOutput play-stdout.txt
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\windows-playing.png")
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Get-Content play-stderr.txt -Tail 60
          if (-not $alive) { throw "ryuon.exe exited early with code $($p.ExitCode)" }

      - name: Version
        id: version
        run: |
          echo "version=$(sed -n "s/^  version: '\(.*\)',/\1/p" meson.build)" >> "$GITHUB_OUTPUT"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path bundle\Ryuon -DestinationPath Ryuon-${{ steps.version.outputs.version }}-windows-portable.zip

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q /DAppVersion=${{ steps.version.outputs.version }} /DSourceDir=..\bundle\Ryuon windows\ryuon.iss
          if ($LASTEXITCODE) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Installer, library, upgrade and uninstall checks
        shell: pwsh
        run: windows\ci-check.ps1 -Version ${{ steps.version.outputs.version }} -Setup dist-installer\Ryuon-${{ steps.version.outputs.version }}-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ryuon-windows
          path: |
            Ryuon-*-windows-portable.zip
            dist-installer/Ryuon-*-Setup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check
          path: |
            windows-screenshot.png
            windows-playing.png
            ryuon-stderr.txt
            play-stderr.txt
            windows-check

  # A tag like v0.4.0 publishes the tested Windows files on the GitHub release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ryuon-windows
          path: files
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files
          find . -type f \( -name '*.zip' -o -name '*.exe' \) -exec mv {} . \;
          sha256sum *.zip *.exe > SHA256SUMS-windows.txt
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "Ryuon ${GITHUB_REF_NAME#v}" --notes "Release notes to follow."
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber *.zip *.exe SHA256SUMS-windows.txt
